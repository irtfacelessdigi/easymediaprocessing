<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMP — Easy Media Processing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F6; --card:#FFFFFF; --ink:#121B2D; --muted:#5B6780; --line:#E1E6EF;
  --primary:#2563EB; --primary-hover:#1D4FD0; --on-primary:#FFFFFF; --primary-soft:#E9F0FF;
  --accent-text:#1D4FD0; --stage:#E6EBF3; --danger:#B42334;
  --toast-bg:#121B2D; --toast-ink:#FFFFFF;
  --chk-a:#D9DDE5; --chk-b:#F1F3F7;
  --shadow:0 1px 2px rgba(18,27,45,.05),0 8px 24px rgba(18,27,45,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1320; --card:#171E2E; --ink:#E9EEFA; --muted:#98A5BF; --line:#2A3449;
    --primary:#2F6DF0; --primary-hover:#4C82F5; --primary-soft:#1B2A4E;
    --accent-text:#8FB3FF; --stage:#101625; --danger:#FF7B88;
    --toast-bg:#E9EEFA; --toast-ink:#121B2D;
    --chk-a:#2A3040; --chk-b:#353C50;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1320; --card:#171E2E; --ink:#E9EEFA; --muted:#98A5BF; --line:#2A3449;
  --primary:#2F6DF0; --primary-hover:#4C82F5; --primary-soft:#1B2A4E;
  --accent-text:#8FB3FF; --stage:#101625; --danger:#FF7B88;
  --toast-bg:#E9EEFA; --toast-ink:#121B2D;
  --chk-a:#2A3040; --chk-b:#353C50;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
